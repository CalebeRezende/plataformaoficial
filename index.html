function realPage(){let e=REAL_EXAMS.find(x=>x.id===realExamId)||REAL_EXAMS[0],r=realState(e),sc=realScore(e);crumb('CADERNOS OFICIAIS · VUNESP');let pdf=`<div class="card"><div class="flex"><h3>Enunciado original</h3><span class="tag blue">PDF da banca</span></div><p class="small">Leia a questão <b id="realPdfNum">${realIndex}</b> no caderno original. O documento é preservado em PDF para manter textos, gráficos e figuras.</p><div class="flex"><a class="real-link" href="${e.pdf}" target="_blank" rel="noopener noreferrer">Abrir prova original ↗</a><a class="real-link" href="${e.keyPdf}" target="_blank" rel="noopener noreferrer">Ver gabarito ↗</a></div><label class="btn light" for="realPdfFile" style="cursor:pointer;display:inline-flex">Carregar PDF baixado no dispositivo</label><input class="hide" type="file" id="realPdfFile" accept="application/pdf"><div class="flex space"><button class="btn light" id="realToggle">${realPdfActive?'Ocultar':'Exibir'} caderno aqui</button><span class="small muted">Se não abrir no celular, use “Abrir prova original”.</span></div><div id="realPdfWrap" ${realPdfActive?'':'class="hide"'}><iframe id="realPdfFrame" class="real-pdf" title="Caderno original de ${e.year}" loading="lazy" src="${realPdfActive?esc(realPdfUrl(e))+'#page=3':''}"></iframe><div class="actions space"><button class="btn light" id="realPdfPrev">Página anterior</button><label class="small" for="realPdfPage">Página PDF</label><input class="field" id="realPdfPage" type="number" min="1" max="80" value="3" style="max-width:85px"><button class="btn light" id="realPdfGo">Ir à página</button><button class="btn light" id="realPdfNext">Próxima página</button></div></div></div>`;let box=`<div class="card"><div class="flex"><div><h3>Folha de respostas</h3><p class="small">${Object.keys(r.answers).length}/${e.n} respondidas</p></div><span id="realTimer" class="tag">${r.startedAt&&!r.corrected?Math.floor((Date.now()-r.startedAt)/60000)+' min decorridos':r.corrected?'Corrigida':'Cronômetro ao responder'}</span></div><div class="progress"><span style="width:${Math.round(Object.keys(r.answers).length*100/e.n)}%"></span></div><div class="real-answer-grid" id="realAnswerGrid">${Array.from({length:e.n},(_,i)=>`<button type="button" class="real-num" data-real-index="${i+1}">${i+1}</button>`).join('')}</div><div id="realQuestion"></div><div class="actions space"><button class="btn light" id="realPrev">← Anterior</button><button class="btn primary" id="realNext">Próxima →</button></div><div class="actions space">${r.corrected?`<button class="btn" id="realRevise">Refazer prova</button><button class="btn primary" id="realReview">Ver análise no relatório</button>`:`<button class="btn primary" id="realFinish">Encerrar e corrigir prova</button><button class="btn light" id="realClearAll">Recomeçar do zero</button>`}</div><p class="small muted">${esc(e.notice)}</p></div>`;let summary=r.corrected?`<div class="card space"><h3>Resultado oficial · TJ-SP ${e.year}</h3><div class="real-result"><span class="tag gold">${sc.good}/${e.n} pontos</span><span class="tag">${sc.percent}% de aproveitamento</span><span class="tag">${sc.voids} anulada(s)</span></div><p class="small">O resultado utiliza apenas o gabarito correspondente ao caderno informado. Questões anuladas contam ponto para todos. Não corresponde à nota nem à classificação do concurso atual.</p></div>`:'';frame('Provas reais · 2024, 2023 e 2009','Leia cada questão original no PDF, responda A–E, confira o gabarito oficial e receba um roteiro de revisão por matéria.',`<div class="note"><strong>280 questões oficiais</strong> + 70 questões autorais na aba “Questões autorais”. As provas históricas não têm necessariamente os mesmos conteúdos ou regras do edital de 2026.</div>${realExamSelect()}<p class="small"><b>${e.location}</b> · ${e.date} · versão ${e.version} · duração da prova: ${e.time}h</p>${summary}<div class="real-layout">${pdf}${box}</div><div class="note space"><strong>Como estudar:</strong> leia a questão no PDF; marque sua resposta aqui; ao concluir, veja as disciplinas com mais erros e clique nas trilhas recomendadas. Se o visor interno for bloqueado pelo site, abra o PDF em outra aba.</div>`);el('realPick').onchange=x=>{realExamId=x.target.value;realIndex=1;render()};el('realPrev').onclick=()=>realUpdate(Math.max(1,realIndex-1));el('realNext').onclick=()=>realUpdate(Math.min(e.n,realIndex+1));document.querySelectorAll('[data-real-index]').forEach(b=>b.onclick=()=>realUpdate(+b.dataset.realIndex));el('realToggle').onclick=()=>{realPdfActive=!realPdfActive;let wrap=el('realPdfWrap');wrap.classList.toggle('hide',!realPdfActive);el('realToggle').textContent=(realPdfActive?'Ocultar':'Exibir')+' caderno aqui';if(realPdfActive)el('realPdfFrame').src=realPdfUrl(e)+'#page='+el('realPdfPage').value};el('realPdfFile').onchange=ev=>{let f=ev.target.files[0];if(!f)return;if(!/pdf/i.test(f.type)&&!f.name.toLowerCase().endsWith('.pdf')){alert('Selecione um PDF.');return}if(realLocalPdf[e.id])URL.revokeObjectURL(realLocalPdf[e.id]);realLocalPdf[e.id]=URL.createObjectURL(f);realPdfActive=true;el('realPdfWrap').classList.remove('hide');el('realToggle').textContent='Ocultar caderno aqui';el('realPdfFrame').src=realLocalPdf[e.id]+'#page=3'};let changePdf=n=>{n=Math.max(1,Math.min(80,n||3));el('realPdfPage').value=n;if(realPdfActive)el('realPdfFrame').src=realPdfUrl(e)+'#page='+n};el('realPdfPrev').onclick=()=>changePdf(+el('realPdfPage').value-1);el('realPdfNext').onclick=()=>changePdf(+el('realPdfPage').value+1);el('realPdfGo').onclick=()=>changePdf(+el('realPdfPage').value);if(!r.corrected){el('realFinish').onclick=()=>{if(!Object.keys(r.answers).length){alert('Responda ao menos uma questão antes de corrigir.');return}if(confirm('Corrigir agora? Respostas em branco serão consideradas erradas; questões anuladas recebem crédito.')){r.corrected=true;r.finishedAt=Date.now();save();render()}};el('realClearAll').onclick=()=>{if(confirm('Apagar as respostas desta prova?')){r.answers={};r.corrected=false;r.startedAt=null;r.finishedAt=null;save();render()}}}else{el('realRevise').onclick=()=>{if(confirm('Reabrir a prova para praticar novamente? As respostas atuais permanecerão marcadas até que você as altere.')){r.corrected=false;r.startedAt=null;save();render()}};el('realReview').onclick=()=>goto('relatorio')}realUpdate(realIndex)}
function realUpdate(n){let e=REAL_EXAMS.find(x=>x.id===realExamId),r=realState(e),sc=realScore(e);realIndex=n;let g=realGroup(e,n),key=e.key[n-1],ans=r.answers[n],chosen=r.tags[n]||'';document.querySelectorAll('[data-real-index]').forEach(b=>{let j=+b.dataset.realIndex,was=r.answers[j],correct=e.key[j-1];b.className='real-num'+(j===n?' sel':'')+(r.corrected?(correct==='N'?' void':correct===was?' right':' wrong'):was?' answered':'')});let modules=REAL_STUDY[g]||[],isVoid=key==='N';el('realQuestion').innerHTML=`<div class="real-section"><div class="flex"><strong>Questão ${n} / ${e.n}</strong><span class="tag blue">${esc(g)}</span></div><p class="small">Leia o enunciado ${n} e suas alternativas no PDF ao lado; marque a resposta abaixo.</p><div class="real-answer-buttons">${'ABCDE'.split('').map(x=>`<button class="real-choice ${ans===x?'selected':''} ${r.corrected&&key===x?'correct':''} ${r.corrected&&ans===x&&key!==x?'incorrect':''}" type="button" data-real-answer="${x}" ${r.corrected?'disabled':''}>${x}</button>`).join('')}</div>${r.corrected?`<div class="note space">${isVoid?'<b>Questão anulada:</b> ponto creditado independentemente da resposta.':`<b>Gabarito oficial: ${key}.</b> ${ans===key?'Você acertou.':ans?'Você marcou '+ans+'. Revise a disciplina abaixo.':'Em branco. Confira o enunciado antes de revisar.'}`}</div>`:''}<label class="small muted" for="realTopicSelect">Assunto específico (opcional: melhora o diagnóstico)</label><select class="real-select" id="realTopicSelect"><option value="">Não classificado dentro da disciplina</option>${modules.map(id=>`<option value="${id}" ${chosen===id?'selected':''}>${esc(TOPICS[id].title)}</option>`).join('')}</select><div class="small muted" style="margin:12px 0 5px">Estude estes módulos da trilha atual:</div><div class="actions">${modules.map(id=>`<button class="btn light" data-real-topic="${id}">${esc(TOPICS[id].title)}</button>`).join('')}</div></div>`;document.querySelectorAll('[data-real-answer]').forEach(b=>b.onclick=()=>{if(r.corrected)return;r.answers[n]=b.dataset.realAnswer;if(!r.startedAt)r.startedAt=Date.now();save();realUpdate(n)});el('realTopicSelect').onchange=ev=>{if(ev.target.value)r.tags[n]=ev.target.value;else delete r.tags[n];save()};document.querySelectorAll('[data-real-topic]').forEach(b=>b.onclick=()=>startPractice(b.dataset.realTopic));let found=el('realPdfNum');if(found)found.textContent=n}

function render(){if(timerID){clearInterval(timerID);timerID=null}renderNav();({dashboard,trilhas,questoes,simulado,discursiva,relatorio:report,fontes,reais:realPage}[view])();if(view==='dashboard')realAttachOverview('dashboard');if(view==='relatorio')realAttachOverview('relatorio');if(view==='reais'){timerID=setInterval(()=>{let t=el('realTimer');if(t){let e=REAL_EXAMS.find(x=>x.id===realExamId),r=realState(e);t.textContent=r.startedAt&&!r.corrected?Math.floor((Date.now()-r.startedAt)/60000)+' min decorridos':r.corrected?'Prova corrigida':'Cronômetro inicia na 1ª resposta'}},20000)}if(view==='simulado'&&store.sim){timerID=setInterval(()=>{let tm=el('sTimer');if(tm)tm.textContent='⏳ '+timerText(simRemaining());if(simRemaining()<=0){clearInterval(timerID);finishSim()}},1000)}}
render();
</script><script>if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
